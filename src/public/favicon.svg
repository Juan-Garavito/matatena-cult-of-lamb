<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="bone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4eed8" />
      <stop offset="1" stop-color="#ddca9e" />
    </linearGradient>
  </defs>

  <!-- Bone die face framed in ritual wood -->
  <rect x="3.5" y="3.5" width="25" height="25" rx="6"
        fill="url(#bone)" stroke="#3d2b1a" stroke-width="1.6" />

  <!-- Ink pips (classic four face) -->
  <circle cx="11" cy="11" r="2.6" fill="#1a1018" />
  <circle cx="21" cy="11" r="2.6" fill="#1a1018" />
  <circle cx="11" cy="21" r="2.6" fill="#1a1018" />
  <circle cx="21" cy="21" r="2.6" fill="#1a1018" />
</svg>
